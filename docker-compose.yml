services:
  streamivio:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PYMOVIEDB_SERVICE_URL: http://catalog-api:8001
    depends_on:
      - catalog-api
  catalog-api:
    build:
      context: ./pymoviedb-service
    restart: unless-stopped
    expose:
      - "8001"
