<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starstruck Arcade</title><style>*{box-sizing:border-box}body{margin:0;background:#070b17;color:#f8fafc;font-family:system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(960px,96vw);padding:20px}canvas{display:block;width:100%;background:radial-gradient(circle at center,#172554,#020617);border:1px solid #334155;border-radius:16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}button{background:#ef4444;color:white;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}.hint{color:#94a3b8}</style></head><body><main><header><div><h1>✨ Starstruck</h1><p>Collect stars, chain combos and dodge asteroids.</p></div><button id="start">Start / Restart</button></header><canvas id="c" width="900" height="520"></canvas><p class="hint">Move with WASD or arrow keys · mouse/touch also moves · collect yellow stars and avoid asteroids.</p></main><script>const c=document.querySelector('#c'),ctx=c.getContext('2d');let p={x:450,y:260,r:13},stars=[],rocks=[],particles=[],score=0,combo=0,active=false,keys={},mouse=null,t=0;function spawn(){stars.push({x:25+Math.random()*850,y:25+Math.random()*470,r:7});if(Math.random()<.75)rocks.push({x:Math.random()*900,y:-20,v:1.4+Math.random()*2,r:12+Math.random()*15})}function reset(){p={x:450,y:260,r:13};stars=[];rocks=[];particles=[];score=0;combo=0;t=0;active=true;for(let i=0;i<6;i++)spawn()}document.querySelector('#start').onclick=reset;window.onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()};window.onkeyup=e=>keys[e.key.toLowerCase()]=false;c.onpointermove=e=>{let r=c.getBoundingClientRect();mouse={x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};c.onpointerdown=()=>{if(!active)reset()};function draw(){ctx.clearRect(0,0,900,520);for(let i=0;i<100;i++){ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect((i*97+t*.2)%900,(i*53)%520,1.5,1.5)}if(active){let dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),dy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);if(mouse){let mx=mouse.x-p.x,my=mouse.y-p.y;if(Math.hypot(mx,my)>10){dx=mx/Math.hypot(mx,my);dy=my/Math.hypot(mx,my)}}p.x=Math.max(p.r,Math.min(900-p.r,p.x+dx*4));p.y=Math.max(p.r,Math.min(520-p.r,p.y+dy*4));if(t%50===0)spawn();stars.forEach((s,i)=>{if(Math.hypot(s.x-p.x,s.y-p.y)<s.r+p.r){stars.splice(i,1);score++;combo++;for(let q=0;q<12;q++)particles.push({x:p.x,y:p.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:25})}});rocks.forEach(r=>{r.y+=r.v;if(Math.hypot(r.x-p.x,r.y-p.y)<r.r+p.r){active=false}});rocks=rocks.filter(r=>r.y<550);particles.forEach(a=>{a.x+=a.vx;a.y+=a.vy;a.life--});particles=particles.filter(a=>a.life>0);t++}stars.forEach(s=>{ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=15;ctx.shadowColor='#facc15';ctx.shadowBlur=0});rocks.forEach(r=>{ctx.fillStyle='#94a3b8';ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#64748b';ctx.stroke()});particles.forEach(a=>{ctx.fillStyle='#fde68a';ctx.globalAlpha=a.life/25;ctx.fillRect(a.x,a.y,3,3);ctx.globalAlpha=1});ctx.fillStyle='#38bdf8';ctx.shadowBlur=18;ctx.shadowColor='#38bdf8';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='white';ctx.font='bold 24px system-ui';ctx.fillText('Score: '+score,20,35);ctx.fillText('Combo: '+combo,20,68);if(!active){ctx.fillStyle='rgba(2,6,23,.65)';ctx.fillRect(0,0,900,520);ctx.textAlign='center';ctx.fillStyle='white';ctx.font='bold 44px system-ui';ctx.fillText(score?'GAME OVER':'STARSTRUCK',450,230);ctx.font='22px system-ui';ctx.fillText(score?'Score '+score+' · Click Start to retry':'Press Start or click canvas',450,280);ctx.textAlign='left'}requestAnimationFrame(draw)}draw();</script></body></html>
