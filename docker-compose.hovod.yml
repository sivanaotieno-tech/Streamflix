services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - streamflix-minio:/data
    environment:
      MINIO_ROOT_USER: streamflix
      MINIO_ROOT_PASSWORD: change-this-local-password
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 streamflix change-this-local-password
        mc mb --ignore-existing local/hovod-vod
        mc anonymous set download local/hovod-vod
    restart: "no"

  hovod:
    image: synapsr/hovod:latest
    restart: unless-stopped
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3001:3000"
    volumes:
      - streamflix-hovod:/data
    environment:
      APP_URL: http://localhost:3001
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: hovod-vod
      S3_ACCESS_KEY_ID: streamflix
      S3_SECRET_ACCESS_KEY: change-this-local-password
      S3_PUBLIC_BASE_URL: http://localhost:9000/hovod-vod
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_ACL: "false"
      AI_ENABLED: "false"
    stop_grace_period: 60s

volumes:
  streamflix-minio:
  streamflix-hovod:
