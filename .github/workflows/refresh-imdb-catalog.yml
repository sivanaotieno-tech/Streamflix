name: Refresh IMDb catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Streamivio
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, json
          tools: composer:v2
      - name: Install IMDb scraper
        working-directory: catalog-importer
        run: composer install --no-interaction --prefer-dist
      - name: Refresh top IMDb charts
        run: php catalog-importer/import.php
      - name: Commit refreshed catalogue
        run: |
          if git diff --quiet -- app/data/imdb-catalog.ts; then
            echo "IMDb catalogue is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/imdb-catalog.ts
          git commit -m "Refresh IMDb Top 250 catalogue"
          git push
